"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:cursor fg:peach)\
$git_branch\
$git_status\
[](fg:cursor bg:base)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:base bg:sapphire)\
$conda\
[](fg:sapphire bg:suc)\
$time\
[ ](fg:suc)\
$cmd_duration\
$line_break\
$character"""

palette = 'spacemacs_dark'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:cursor"
format = '[[ $symbol $branch ](fg:crust bg:cursor)]($style)'

[git_status]
style = "bg:cursor"
format = '[[($all_status$ahead_behind )](fg:crust bg:cursor)]($style)'

[nodejs]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[bun]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[c]
symbol = " "
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[rust]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[golang]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[php]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[java]
symbol = " "
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[kotlin]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[haskell]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version) ](fg:crust bg:base)]($style)'

[python]
symbol = ""
style = "bg:base"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:base)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:suc"
format = '[[  $time ](fg:crust bg:suc)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:suc"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# Spacemacs-inspired palette (dark). Segment hues sweep in a spumone
# ice-cream pattern: red → purple → off-white → light gray → lime green → bright green.
# Colors sourced exclusively from nashamri/spacemacs-theme.
[palettes.spacemacs_dark]
red       = "#ce537a"   # type (pink-red)      -> OS / username
peach     = "#bc6ec5"   # func (purple)        -> directory
cursor    = "#e3dedd"   # cursor (warm white)  -> git (spumone "white" 1)
base      = "#b2b2b2"   # default text (gray)  -> languages (spumone "white" 2)
sapphire  = "#67b11d"   # head3 (green)        -> conda / docker
suc       = "#86dc2f"   # success (lime green) -> time (spumone green end)
yellow    = "#b1951d"   # head4 (gold/amber)
green     = "#2d9574"   # str (teal/aqua)
lavender  = "#4f97d7"   # keyword (sky blue)
purple    = "#5d4d7a"   # act2 (modeline purple)
blue      = "#4f97d7"   # keyword
aqua      = "#2d9574"   # str
magenta   = "#a31db1"   # magenta
cyan      = "#2aa1ae"   # comment teal
orange    = "#dc752f"   # warning
err       = "#f2241f"   # error red
bg1       = "#292b2e"   # main background
crust     = "#0a0814"   # bg4 (near-black, text on segments)
