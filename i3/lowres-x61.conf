# ============================================================
# Low-resolution tweaks (ThinkPad X61, 1024x768 LVDS-1)
# ============================================================
# Appended to the base i3 config only on the X61 (gated by hostname
# in home.nix).  Floating dialogs (file chooser, print, etc.) default
# to a size larger than the 1024x768 screen, pushing the title bar and
# Open/Cancel buttons off-screen so they can't be reached.  Cap every
# floating window to fit the workarea and center dialogs on screen.
#
# 1000x700 fits the usable area (1024 wide, 768 - 28 px i3bar) with a
# small margin and leaves room for the 2 px floating border.

floating_maximum_size 1000 x 700

# Re-state the dialog rules with centering so the (now size-capped)
# dialogs land in the middle of the screen where their title bars stay
# reachable.  i3 applies later matching rules on top of the earlier
# `floating enable` ones, so this just adds `move position center`.
for_window [window_role="pop-up"]      move position center
for_window [window_role="dialog"]      move position center
for_window [window_role="task_dialog"] move position center
