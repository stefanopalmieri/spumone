# ============================================================
# Low-resolution panel tweaks (trait: host.lowres)
# ============================================================
# Appended to the base i3 config when the host's `host` attrset has
# `lowres = true` (see flake.nix mkHome + home.nix).  Floating dialogs
# (file chooser, print, etc.) default to a size larger than a sub-HD
# panel, pushing the title bar and Open/Cancel buttons off-screen so
# they can't be reached.  Cap every floating window to fit the workarea
# and center dialogs on screen.
#
# Tuned for a 1024x768 panel (e.g. the ThinkPad X61's LVDS-1): 1000x700
# fits the usable area (1024 wide, 768 - 28 px i3bar) with a small
# margin and leaves room for the 2 px floating border.  Reasonable for
# any panel at or below that resolution; for a different size, add a
# new trait + snippet (e.g. host.lowres-1366 -> i3/lowres-1366.conf).

floating_maximum_size 1000 x 700

# Re-state the dialog rules with centering so the (now size-capped)
# dialogs land in the middle of the screen where their title bars stay
# reachable.  i3 applies later matching rules on top of the earlier
# `floating enable` ones, so this just adds `move position center`.
for_window [window_role="pop-up"]      floating enable, move position center
for_window [window_role="dialog"]      floating enable, move position center
for_window [window_role="task_dialog"] floating enable, move position center
# GTK dialogs report roles like "GtkFileChooserDialog" (capital D), which the
# case-sensitive `window_role="dialog"` regex above does NOT match -- they only
# get i3's implicit auto-float, no cap/center (Firefox/Chromium file pickers
# opened at 1243x822, titlebar off-screen).  Match the window type instead:
# every modal dialog, any role spelling.
for_window [window_type="dialog"]      floating enable, move position center
